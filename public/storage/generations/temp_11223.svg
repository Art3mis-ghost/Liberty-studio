          <line x1="0" y1="503.99999999999994" x2="1280" y2="503.99999999999994" />
          <line x1="422.40000000000003" y1="0" x2="422.40000000000003" y2="720" stroke-dasharray="6,6" />
          <line x1="844.8000000000001" y1="0" x2="844.8000000000001" y2="720" stroke-dasharray="6,6" />
          <circle cx="640" cy="324" r="201.60000000000002" fill="none" stroke="#3a0ca3" stroke-opacity="0.3" stroke-width="1.5" />
          <circle cx="640" cy="324" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
        </g>

        <!-- Dynamic cinematic light streak -->
        <path d="M 0 216 Q 640 432 1280 144" stroke="#3a0ca3" stroke-width="4" fill="none" opacity="0.4" />
        <path d="M 0 360 Q 512 144 1280 576" stroke="#4cc9f0" stroke-width="2" fill="none" opacity="0.3" />

